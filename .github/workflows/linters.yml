name: Linters

on: pull_request

env:
  FORCE_COLOR: 1

jobs:
  rubocop:
    name: Rubocop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true
      - name: Install Rubocop
        run: |
          gem install --no-document rubocop -v '>= 1.0, < 2.0'
          gem install --no-document rubocop-rails -v '>= 2.0, < 3.0'
      - name: Run Rubocop
        run: bundle exec rubocop --color

  nodechecker:
    name: Node Modules Checker
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Check node_modules existence
        run: |
          if [ -d "node_modules/" ]; then
            echo -e "\e[1;31mThe node_modules/ folder was pushed to the repo. Please remove it from GitHub and try again."
            echo -e "\e[1;32mYou can set up a .gitignore file with this folder included to prevent this."
            exit 1
          fi